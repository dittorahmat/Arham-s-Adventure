<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed solid/gradient background for Android maskable cropping -->
  <rect x="0" y="0" width="512" height="512" fill="url(#maskableBg)" />

  <!-- All key iconography safely centered within inner 72% circle (14% safe margin on all sides) -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <!-- Golden Top Star Crest -->
    <g transform="translate(256 126)">
      <circle cx="0" cy="0" r="56" fill="#facc15" stroke="#1e293b" stroke-width="14" />
      <polygon
        points="0,-34 10,-11 35,-11 15,4 22,29 0,14 -22,29 -15,4 -35,-11 -10,-11"
        fill="#fffbeb"
        stroke="#1e293b"
        stroke-width="7"
        stroke-linejoin="round"
      />
    </g>

    <!-- Royal Blue Ribbon Shield -->
    <path
      d="M62 198 L452 178 L434 320 L48 340 Z"
      fill="#1e3a8a"
      stroke="#1e293b"
      stroke-width="16"
      stroke-linejoin="round"
    />
    <path d="M76 212 L436 194 L422 306 L64 324 Z" fill="#2563eb" />

    <text
      x="256"
      y="286"
      text-anchor="middle"
      font-family="Fredoka, Arial Rounded MT Bold, sans-serif"
      font-weight="800"
      font-size="102"
      fill="#fef08a"
      stroke="#1e293b"
      stroke-width="18"
      paint-order="stroke fill"
      letter-spacing="2"
    >
      ARHAM
    </text>

    <!-- Red Adventure Plaque -->
    <rect
      x="104"
      y="324"
      width="304"
      height="84"
      rx="26"
      fill="#ef4444"
      stroke="#1e293b"
      stroke-width="14"
    />
    <text
      x="256"
      y="381"
      text-anchor="middle"
      font-family="Fredoka, Arial Rounded MT Bold, sans-serif"
      font-weight="800"
      font-size="44"
      fill="#ffffff"
      stroke="#1e293b"
      stroke-width="9"
      paint-order="stroke fill"
      letter-spacing="2"
    >
      KUIS SD
    </text>
  </g>
</svg>
